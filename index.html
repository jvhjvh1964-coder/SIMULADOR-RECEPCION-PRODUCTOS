const recepcionistas = [

];

const precios = [

    85000, 90000, 95000, 100000
];

function crearTabla(){

    const tabla =
        document.getElementById("tabla");

    tabla.innerHTML = "";

    let header =
        document.createElement("tr");

    header.innerHTML = `

        <th class="col-prod">
            PROD.
        </th>

        <th style="width:150px;">
            FECHA COMPRA
        </th>

        <th>
            PROVEEDOR
        </th>

        <th>
            RECEPCIONISTA
        </th>

        <th class="doc">
            DOCUMENTO
        </th>

        <th>
            N° DOCUMENTO
        </th>

        <th class="col-cant">
            CANT.
        </th>

        <th>
            PRECIO
        </th>

        <th>
            TOTAL
        </th>

    `;

    tabla.appendChild(header);


    // Distribución inicial aleatoria
    let coloresFilas = [
        0,1,2,3,4
    ];

    coloresFilas.sort(
        () => Math.random() - 0.5
    );


    for(let i=0; i<5; i++){

        let tr =
            document.createElement("tr");

        tr.className =
            "fila" + coloresFilas[i];


        tr.innerHTML = `

        <td class="col-prod">

            <select
                id="tipo${i}"
                onchange="procesarRespuestaAutomatica()"
            >

                ${tipos.map(
                    t => `<option>${t}</option>`
                ).join("")}

            </select>

        </td>


        <td>

            <input
                type="date"
                id="fecha${i}"
                style="width:130px; font-size:18px;"
                onchange="procesarRespuestaAutomatica()"
            >

        </td>


        <td>

            <select
                class="proveedor"
                id="proveedor${i}"
                onchange="procesarRespuestaAutomatica()"
            >

                ${proveedores.map(
                    p => `<option>${p}</option>`
                ).join("")}

            </select>

        </td>


        <td>

            <select
                class="recepcionista"
                id="recepcionista${i}"
                onchange="procesarRespuestaAutomatica()"
            >

                ${recepcionistas.map(
                    r => `<option>${r}</option>`
                ).join("")}

            </select>

        </td>


        <td>

            <select
                class="doc"
                id="doc${i}"
                onchange="procesarRespuestaAutomatica()"
            >

                ${docs.map(
                    d => `<option>${d}</option>`
                ).join("")}

            </select>

        </td>


        <td>

            <input
                type="number"
                id="num${i}"
                min="10011"
                max="99999"
                onkeydown="procesarConEnter(event)"
            >

        </td>


        <td class="col-cant">

            <input
                type="number"
                id="cant${i}"
                oninput="calcular(${i})"
                onkeydown="procesarConEnter(event)"
            >

        </td>


        <td class="money col-precio">

            <select
                id="precio${i}"
                onchange="
                    calcular(${i});
                    procesarRespuestaAutomatica()
                "
            >

                ${precios.map(
                    p =>
                    `<option value="${p}">
                        $${formatearMiles(p)}
                    </option>`
                ).join("")}

            </select>

        </td>


        <td class="money">

            <input
                type="text"
                class="total"
                id="total${i}"
                readonly
            >

        </td>

        `;


        tabla.appendChild(tr);


        // TIPO PRODUCTO
        let tipo =
            tipos[
                Math.floor(
                    Math.random() * tipos.length
                )
            ];

        document.getElementById(
            `tipo${i}`
        ).value = tipo;


        // FECHA COMPRA
        let fecha = new Date();

        fecha.setDate(
            fecha.getDate() +
            Math.floor(Math.random() * 10)
        );

        document.getElementById(
            `fecha${i}`
        ).value =
            fecha.toISOString().split("T")[0];


        // NÚMERO DOCUMENTO
        let numero =
            Math.floor(
                Math.random() *
                (99999 - 10011 + 1)
            ) + 10011;


        // CANTIDAD
        let cantidad =
            Math.floor(
                Math.random() *
                (99 - 10 + 1)
            ) + 10;


        // PRECIO
        let precio =
            precios[
                Math.floor(
                    Math.random() *
                    precios.length
                )
            ];


        // DOCUMENTO
        let documento =
            docs[
                Math.floor(
                    Math.random() *
                    docs.length
                )
            ];


        // PROVEEDOR
        let proveedor =
            proveedores[
                Math.floor(
                    Math.random() *
                    proveedores.length
                )
            ];


        // RECEPCIONISTA
        let recepcionista =
            recepcionistas[
                Math.floor(
                    Math.random() *
                    recepcionistas.length
                )
            ];


        document.getElementById(
            `proveedor${i}`
        ).value = proveedor;


        document.getElementById(
            `recepcionista${i}`
        ).value = recepcionista;


        document.getElementById(
            `num${i}`
        ).value = numero;


        document.getElementById(
            `cant${i}`
        ).value = cantidad;


        document.getElementById(
            `precio${i}`
        ).value = precio;


        document.getElementById(
            `doc${i}`
        ).value = documento;


        calcular(i);
    }
}


function limpiarNumero(valor){

    return Number(
        String(valor).replace(/\./g,'')
    ) || 0;

}


function formatearMiles(num){

    return num.toString().replace(
        /\B(?=(\d{3})+(?!\d))/g,
        "."
    );

}


function formatearPrecio(i){

    let input =
        document.getElementById(`precio${i}`);

    let limpio =
        limpiarNumero(input.value);

    input.value =
        formatearMiles(limpio);

    calcular(i);

}


function calcular(i){

    let c =
        limpiarNumero(
            document.getElementById(
                `cant${i}`
            ).value
        );


    let p =
        limpiarNumero(
            document.getElementById(
                `precio${i}`
            ).value
        );


    let total = c * p;


    document.getElementById(
        `total${i}`
    ).value =
        formatearMiles(total);

}


// GENERAR 50 ACCIONES
function generarAcciones(){

    acciones = [];


    for(let i=0; i<50; i++){

        let fila =
            Math.floor(
                Math.random() * 5
            );


        let tipoAccion =
            Math.floor(
                Math.random() * 8
            );


        let accion = { fila };


        switch(tipoAccion){

            case 0:

                accion.tipo =
                    "cantidad";

                accion.valor =
                    Math.floor(
                        Math.random() *
                        (99 - 10 + 1)
                    ) + 10;

                break;


            case 1:

                accion.tipo =
                    "precio";

                accion.valor =
                    precios[
                        Math.floor(
                            Math.random() *
                            precios.length
                        )
                    ];

                break;


            case 2:

                accion.tipo =
                    "documento";

                accion.valor =
                    docs[
                        Math.floor(
                            Math.random() *
                            docs.length
                        )
                    ];

                break;


            case 3:

                accion.tipo =
                    "numero";

                accion.valor =
                    Math.floor(
                        Math.random() *
                        (99999 - 10011 + 1)
                    ) + 10011;

                break;


            case 4:

                accion.tipo =
                    "tipo";

                accion.valor =
                    tipos[
                        Math.floor(
                            Math.random() *
                            tipos.length
                        )
                    ];

                break;


            case 5:

                accion.tipo =
                    "fecha";

                let fecha =
                    new Date();

                fecha.setDate(
                    fecha.getDate() +
                    Math.floor(
                        Math.random() * 10
                    )
                );

                accion.valor =
                    fecha.toISOString()
                        .split("T")[0];

                break;


            case 6:

                accion.tipo =
                    "proveedor";

                accion.valor =
                    proveedores[
                        Math.floor(
                            Math.random() *
                            proveedores.length
                        )
                    ];

                break;


            case 7:

                accion.tipo =
                    "recepcionista";

                accion.valor =
                    recepcionistas[
                        Math.floor(
                            Math.random() *
                            recepcionistas.length
                        )
                    ];

                break;
        }


        acciones.push(accion);
    }
}

            }
        );


    const hora =
        ahora.toLocaleTimeString(
            "es-CL",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:false
            }
        );


    document.getElementById(
        "fechaHoraFinal"
    ).innerText =
        `FECHA: ${fecha}  |  HORA: ${hora}`;


    document.getElementById(
        "mensajeNotaFinal"
    ).style.display =
        "flex";
}


function iniciarJuego(){

    clearInterval(intervalo);

    correctas = 0;
    tiempo = 180;
    indice = 0;
    bloqueado = false;


    document.getElementById(
        "correctas"
    ).innerText = 0;


    incorrectas = 0;


    document.getElementById(
        "incorrectas"
    ).innerText = 0;


    generarAcciones();


    intervalo =
        setInterval(()=>{

            tiempo--;

            document.getElementById(
                "tiempo"
            ).innerText =
                tiempo;


            if(tiempo <= 0){

                clearInterval(
                    intervalo
                );

                document.getElementById(
                    "accion"
                ).innerText =
                    "TIEMPO TERMINADO";


                bloqueado = true;


                mostrarNotaFinal();
            }

        },1000);


    siguienteAccion();
}


function siguienteAccion(){

    if(
        indice >= acciones.length ||
        bloqueado
    ){
        return;
    }


    let a =
        acciones[indice];

    let texto = "";


    switch(a.tipo){

        case "cantidad":

            texto =
                `PREGUNTA: EN FILA #${
                    a.fila + 1
                } INGRESAR <b>[CANTIDAD ${
                    a.valor
                }]</b>`;

            break;


        case "precio":

            texto =
                `Pregunta: EN FILA #${
                    a.fila + 1
                } INGRESAR <b>[PRECIO $${
                    formatearMiles(a.valor)
                }]</b>`;

            break;


        case "documento":

            texto =
                `pregunta: EN FILA #${
                    a.fila + 1
                } SELECCIONAR <b>[${a.valor}]</b>`;

            break;


        case "numero":

            texto =
                `PREGUNTA: EN FILA #${
                    a.fila + 1
                } INGRESAR <b>[NÚMERO DOCUMENTO ${
                    a.valor
                }]</b>`;

            break;


        case "tipo":

            texto =
                `Pregunta: EN FILA #${
                    a.fila + 1
                } SELECCIONAR <b>[TIPO PRODUCTO ${
                    a.valor
                }]</b>`;

            break;


        case "fecha":

            texto =
                `pregunta: EN FILA #${
                    a.fila + 1
                } INGRESAR <b>[FECHA COMPRA ${
                    a.valor
                }]</b>`;

            break;


        case "proveedor":

            texto =
                `PREGUNTA: EN FILA #${
                    a.fila + 1
                } SELECCIONAR <b>[PROVEEDOR ${
                    a.valor
                }]</b>`;

            break;


        case "recepcionista":

            texto =
                `Pregunta: EN FILA #${
                    a.fila + 1
                } SELECCIONAR <b>[RECEPCIONISTA ${
                    a.valor
                }]</b>`;

            break;
    }


    document.getElementById(
        "accion"
    ).innerHTML =
        texto.toUpperCase();


    indice++;
}


function procesarRespuestaAutomatica(){

    if(
        bloqueado ||
        bloqueadoTemporal
    ){
        return;
    }


    if(indice <= 0){
        return;
    }


    verificar();
}


function procesarConEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        procesarRespuestaAutomatica();
    }
}


function verificar(){

    if(
        bloqueado ||
        bloqueadoTemporal
    ){
        return;
    }


    let a =
        acciones[indice - 1];


    if(!a){
        return;
    }


    let valor;


    switch(a.tipo){

        case "cantidad":

            valor =
                document.getElementById(
                    `cant${a.fila}`
                ).value;

            break;


        case "precio":

            valor =
                limpiarNumero(
                    document.getElementById(
                        `precio${a.fila}`
                    ).value
                );

            break;


        case "documento":

            valor =
                document.getElementById(
                    `doc${a.fila}`
                ).value;

            break;


        case "numero":

            valor =
                document.getElementById(
                    `num${a.fila}`
                ).value;

            break;


        case "tipo":

            valor =
                document.getElementById(
                    `tipo${a.fila}`
                ).value;

            break;


        case "fecha":

            valor =
                document.getElementById(
                    `fecha${a.fila}`
                ).value;

            break;


        case "proveedor":

            valor =
                document.getElementById(
                    `proveedor${a.fila}`
                ).value;

            break;


        case "recepcionista":

            valor =
                document.getElementById(
                    `recepcionista${a.fila}`
                ).value;

            break;
    }


    // ==========================================
    // RESPUESTA CORRECTA
    // ==========================================

    if(
        String(valor) ===
        String(a.valor)
    ){

        correctas++;


        document.getElementById(
            "correctas"
        ).innerText =
            correctas;


        // Mostrar ✔️ azul
        mostrarMensajeCorrecto();


        // CAMBIO DE COLORES
        // DESPUÉS DE RESPUESTA CORRECTA
        cambiarColoresFilas();


        siguienteAccion();


    }else{


        // ======================================
        // RESPUESTA INCORRECTA
        // ======================================

        incorrectas++;


        document.getElementById(
            "incorrectas"
        ).innerText =
            incorrectas;


        // Mostrar ✕ roja
        mostrarMensajeIncorrecto();


        // CAMBIO DE COLORES
        // DESPUÉS DE RESPUESTA INCORRECTA
        cambiarColoresFilas();


        let textoCorrecto = "";


        switch(a.tipo){

            case "cantidad":

                textoCorrecto =
                    `RESPUESTA CORRECTA: CANTIDAD ${
                        a.valor
                    }`;

                break;


            case "precio":

                textoCorrecto =
                    `RESPUESTA CORRECTA: PRECIO $${
                        formatearMiles(a.valor)
                    }`;

                break;


            case "documento":

                textoCorrecto =
                    `RESPUESTA CORRECTA: ${
                        a.valor
                    }`;

                break;


            case "numero":

                textoCorrecto =
                    `RESPUESTA CORRECTA: N° ${
                        a.valor
                    }`;

                break;


            case "tipo":

                textoCorrecto =
                    `RESPUESTA CORRECTA: ${
                        a.valor
                    }`;

                break;


            case "fecha":

                textoCorrecto =
                    `RESPUESTA CORRECTA: ${
                        a.valor
                    }`;

                break;


            case "proveedor":

                textoCorrecto =
                    `RESPUESTA CORRECTA: PROVEEDOR ${
                        a.valor
                    }`;

                break;


            case "recepcionista":

                textoCorrecto =
                    `RESPUESTA CORRECTA: RECEPCIONISTA ${
                        a.valor
                    }`;

                break;
        }


        document.getElementById(
            "accion"
        ).innerText =
            textoCorrecto;


        bloqueadoTemporal = true;


        setTimeout(()=>{

            bloqueadoTemporal = false;

            siguienteAccion();

        },500);
    }
}


// =====================================================
// FUNCIÓN NUEVA / ACTUALIZADA
// CAMBIA ALEATORIAMENTE LOS COLORES DE LAS 5 FILAS
// =====================================================

function cambiarColoresFilas(){

    // Los cinco colores disponibles
    let colores = [
        0,1,2,3,4
    ];


    // Mezcla Fisher-Yates
    for(
        let i = colores.length - 1;
        i > 0;
        i--
    ){

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            colores[i],
            colores[j]
        ] =
        [
            colores[j],
            colores[i]
        ];
    }


    // Aplicar un color a cada
    // una de las 5 filas
    for(
        let i = 0;
        i < 5;
        i++
    ){

        const fila =
            document.querySelector(
                `#tabla tr:nth-child(${i + 2})`
            );


        if(!fila){
            continue;
        }


        // Eliminar cualquier color anterior
        fila.classList.remove(
            "fila0",
            "fila1",
            "fila2",
            "fila3",
            "fila4"
        );


        // Aplicar nuevo color
        fila.classList.add(
            `fila${colores[i]}`
        );
    }
}


function mostrarMensajeZoom(){

    const mensaje =
        document.getElementById(
            "mensajeZoom"
        );


    mensaje.style.display =
        "flex";


    const emoji =
        mensaje.querySelector(
            "span"
        );


    emoji.style.animation =
        "none";


    void emoji.offsetWidth;


    emoji.style.animation =
        "zoomGiratorio 1s ease-out forwards";


    setTimeout(()=>{

        mensaje.style.display =
            "none";

    },1000);
}


function aceptarDatos(){

    const curso =
        document.getElementById(
            "curso"
        ).value.trim();


    const nombre =
        document.getElementById(
            "nombreEstudiante"
        ).value.trim();


    if(
        curso === "" ||
        nombre === ""
    ){

        alert(
            "INGRESE CURSO Y NOMBRE DEL ESTUDIANTE"
        );

    }


    document.getElementById(
        "modalDatos"
    ).style.display =
        "none";


    mostrarMensajeZoom();


    setTimeout(()=>{

        iniciarJuego();
